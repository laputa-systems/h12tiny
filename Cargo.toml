[package]
name = "h12tiny"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "small http(s) 1 and 2 things"
license = "MIT"
repository = "https://github.com/laputa-systems/h12tiny"
exclude = ["scripts/bump_minor_release.sh"]

[workspace]
members = [
    "crates/h12tiny-core",
    "crates/h12tiny-client",
    "crates/h12tiny-client-normalize",
    "crates/h12tiny-client-sync",
    "crates/h12tiny-server",
    "crates/h12tiny-util",
    "crates/h12tiny-web",
]
resolver = "2"

[workspace.dependencies]
async-io = "2.6"
async-net = "2.0"
bytes = "1.12.1"
futures-channel = "0.3.34"
futures-io = "0.3.34"
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
futures-rustls = { version = "0.26.0", default-features = false, features = ["tls12"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
http = "1.5.0"
http-body = "1.1.0"
hyper = { package = "laputa-hyper-futures-lite", version = "=1.11.1-beta.0", default-features = false }
pin-project-lite = "0.2.17"
# h12tiny builds every TLS config with `builder_with_provider`, selecting
# Graviola explicitly. Do not enable Rustls' `custom-provider` feature: Cargo
# feature unification would otherwise disable another library's unambiguous
# ring or aws-lc-rs default in the same process.
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12"] }
rustls-graviola = { version = "0.4.0", default-features = false }
webpki-roots = "1.0.9"

[features]
# The facade deliberately defaults to no roles or protocols.  Applications can
# select the smallest component directly, or opt into these forwarding flags.
default = []
core = ["dep:h12tiny-core"]
client = ["core", "dep:h12tiny-client"]
client-sync = ["dep:h12tiny-client-sync"]
server = ["core", "dep:h12tiny-server"]
util = ["dep:h12tiny-util"]
web = ["dep:h12tiny-web", "server", "util"]
http1 = ["h12tiny-client?/http1", "h12tiny-server?/http1"]
http2 = ["h12tiny-client?/http2", "h12tiny-server?/http2"]
tls = ["h12tiny-client?/tls", "h12tiny-client-sync?/tls", "h12tiny-server?/tls"]
upgrade = ["server", "http1", "h12tiny-server/upgrade", "h12tiny-web?/upgrade"]
json = ["util", "h12tiny-util/json", "h12tiny-web?/json"]
query = ["web", "h12tiny-web/query"]
sse = ["web", "h12tiny-web/sse"]
cors = ["web", "h12tiny-web/cors"]
# RFC 6455 request validation, handshake response construction, and a
# futures-lite framed upgraded connection. Raw `HttpUpgrade` remains available
# through `upgrade` for applications that own another upgrade protocol.
websocket = ["web", "upgrade", "h12tiny-web/websocket"]
full = ["client", "client-sync", "server", "util", "web", "http1", "http2", "tls", "upgrade", "json", "query", "sse", "cors", "websocket"]

# These are runnable integration tools rather than protocol-only examples.
# Keep feature-minimal library builds useful without trying to compile their
# networking/TLS surfaces.
[[example]]
name = "interop-server"
required-features = ["server", "http1", "http2", "tls"]

[[example]]
name = "client-load"
required-features = ["client", "http1", "http2", "tls"]

[[example]]
name = "h2-reference-server"
required-features = ["server", "http2"]

[dependencies]
h12tiny-core = { version = "0.2.0", path = "crates/h12tiny-core", optional = true, default-features = false }
h12tiny-client = { version = "0.2.0", path = "crates/h12tiny-client", optional = true, default-features = false }
h12tiny-client-sync = { version = "0.2.0", path = "crates/h12tiny-client-sync", optional = true, default-features = false }
h12tiny-server = { version = "0.2.0", path = "crates/h12tiny-server", optional = true, default-features = false }
h12tiny-util = { version = "0.2.0", path = "crates/h12tiny-util", optional = true, default-features = false }
h12tiny-web = { version = "0.2.0", path = "crates/h12tiny-web", optional = true, default-features = false }

[dev-dependencies]
async-io = { workspace = true }
async-net = { workspace = true }
bytes = { workspace = true }
futures-channel = { workspace = true }
futures-io = { workspace = true }
futures-lite = { workspace = true }
futures-rustls = { workspace = true }
futures-util = { workspace = true, features = ["io"] }
http = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
rustls = { workspace = true }
rustls-graviola = { workspace = true }
smol = "2.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(h12tiny_unstable)"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

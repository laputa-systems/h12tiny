name: lint

on:
  pull_request:
  push:
    branches: [main, master]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: h12tiny

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: h12tiny
      - id: smolith-rev
        run: echo "rev=$(tr -d '[:space:]' < SMOLITH_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: laputa-systems/smolith
          ref: ${{ steps.smolith-rev.outputs.rev }}
          path: smolith
          persist-credentials: false
      - name: lint
        run: make lint

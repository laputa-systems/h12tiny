[workspace]
resolver = "3"
members = ["crates/app-core", "crates/h12tiny-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.23"
futures-channel = "0.3.34"
h12tiny = { version = "0.8.0", path = "../..", default-features = false }
hmac = "0.12.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
deser = { version = "0.10.2", features = ["derive"] }
deser-json = "0.10.2"
deser-value = "0.10.2"
sha2 = "0.10.9"
signal-hook = "0.3.18"
smol = { package = "laputa-smol", version = "0.3.0" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

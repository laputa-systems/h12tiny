# Harness-owned main config. The distribution default runs one worker per CPU
# (18 here instead of the box's one vCPU), leaves the worker file-descriptor
# limit at the system default, and loads sites-enabled, whose default_server
# collides with the mounted benchmark site. One worker, worker_rlimit_nofile
# 65535 and worker_connections 16384 follow the challenge's bench/nginx.conf
# note; conf.d is the only site source, so /etc/nginx/conf.d/default.conf is
# the unchanged challenge file.
user www-data;
worker_processes 1;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}

[package]
name = "h12tiny-server"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
description = "Runtime-neutral HTTP server primitives for h12tiny"
license = "MIT"

repository = "https://github.com/laputa-systems/h12tiny"
[features]
default = []
http1 = ["hyper/server", "hyper/http1"]
http2 = ["hyper/server", "hyper/http2"]
tls = ["dep:futures-rustls", "dep:rustls", "dep:rustls-graviola"]
upgrade = ["http1"]

[dependencies]
async-net = { workspace = true }
bytes = { workspace = true }
futures-channel = { workspace = true }
futures-io = { workspace = true }
futures-rustls = { workspace = true, optional = true }
futures-util = { workspace = true }
h12tiny-core = { version = "0.5.0", path = "../h12tiny-core", default-features = false }
http = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true }
pin-project-lite = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-graviola = { workspace = true, optional = true }

[dev-dependencies]
futures-lite = { workspace = true }

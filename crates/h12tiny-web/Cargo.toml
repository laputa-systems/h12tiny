[package]
name = "h12tiny-web"
version = "0.7.0"
edition = "2021"
rust-version = "1.89"
description = "Small application routing adapter for h12tiny"
license = "MIT"

repository = "https://github.com/laputa-systems/h12tiny"
[features]
default = []
json = ["h12tiny-util/json", "dep:deser", "dep:deser-json"]
query = ["dep:deser", "dep:deser-json"]
sse = []
cors = []
upgrade = ["dep:h12tiny-server", "h12tiny-server/upgrade"]
# Optional RFC 6455 boundary. This feature validates the HTTP/1.1 upgrade,
# builds the 101 response, and adapts the resulting stream to the local
# futures-lite frame parser; application message policy remains outside h12tiny.
websocket = ["upgrade", "dep:base64", "dep:fastwebsockets", "dep:futures-lite", "dep:h12tiny-core", "dep:sha1"]

[dependencies]
async-io = { workspace = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true }
fastwebsockets = { package = "laputa-fastwebsockets-futures-lite", version = "0.10.1", path = "../laputa-fastwebsockets-futures-lite", optional = true }
futures-lite = { workspace = true, optional = true }
futures-util = { workspace = true }
h12tiny-core = { version = "0.7.0", path = "../h12tiny-core", default-features = false, optional = true }
h12tiny-server = { version = "0.7.0", path = "../h12tiny-server", default-features = false, optional = true }
h12tiny-util = { version = "0.7.0", path = "../h12tiny-util", default-features = false }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = "0.1.5"
hyper = { workspace = true }
matchit = "0.9.2"
deser = { version = "0.10.2", optional = true, default-features = false }
deser-json = { version = "0.10.2", optional = true, default-features = false }
sha1 = { version = "0.11.0", optional = true }

[dev-dependencies]
deser = { version = "0.10.2", default-features = false, features = ["derive"] }
futures-lite = { workspace = true }

[package]
name = "laputa-fastwebsockets-futures-lite"
description = "A fast RFC6455 WebSocket implementation adapted for futures-lite::io"
version = "0.10.1"
authors = ["Divy Srivastava <dj.srivastava23@gmail.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
autoexamples = false
repository = "https://github.com/denoland/fastwebsockets"

[lib]
name = "fastwebsockets"

[dependencies]
futures-lite = { package = "laputa-futures-lite", version = "0.2.0" }
simdutf8 = "0.1.5"
getrandom = { version = "0.4.3", features = ["std"] }
thiserror = "2.0.21"
bytes = "1.5.0"

[dev-dependencies]
fastrand = { package = "laputa-fastrand", version = "0.2.0" }
futures-lite = { package = "laputa-futures-lite", version = "0.2.0" }

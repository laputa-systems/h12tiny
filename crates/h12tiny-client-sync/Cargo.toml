[package]
name = "h12tiny-client-sync"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Blocking direct-origin HTTP/1.1 client for h12tiny"
license = "MIT OR Apache-2.0"

[features]
default = []
tls = ["dep:rustls", "dep:rustls-graviola", "dep:webpki-roots"]

[dependencies]
h12tiny-client-normalize = { version = "0.1.0", path = "../h12tiny-client-normalize" }
http = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-graviola = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
